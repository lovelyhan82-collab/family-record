<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<title>우리 가족 기록장 · 택민이</title>
<style>
:root{
  --cream:#FFFBE6; --cream-2:#FFFDF4; --cream-3:#FFF6E3;
  --card:#FFFFFF; --line:#F2E7C9; --line-soft:#F7EFD9;
  --ink:#4A423A; --ink-2:#6E6457; --muted:#A89D8B;
  --pink:#E78CA8; --pink-2:#F7B9C8; --pink-soft:#FDEDF2;
  --blue:#8CBCE4; --blue-deep:#7FB3E0; --blue-soft:#EAF4FC;
  --green:#7FC79A; --green-soft:#E9F7EE;
  --yellow:#FAD97F; --yellow-soft:#FFF6D8;
  --shadow-sm:0 2px 7px rgba(205,183,135,.14);
  --shadow:0 8px 22px rgba(203,180,130,.16);
  --r:20px;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;
  background:#F4EBD9; color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:0;height:0}
.app{
  position:relative; width:100%; max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh;
  background:radial-gradient(125% 55% at 50% 0%,#FFFCEE 0%,#FFFDF7 42%,#FFF8E8 78%,#FFF5DF 100%);
  display:flex; flex-direction:column; overflow-x:clip;
  box-shadow:0 0 60px rgba(180,150,90,.12);
}
body.wide .app{max-width:100%}
body.wide .tabbar,body.wide .composer{max-width:100%}

/* ---------- header ---------- */
.app-header{
  position:sticky; top:0; z-index:22; padding:14px 16px 10px;
  background:linear-gradient(180deg,#FFFCEC 0%,#FFFBEB 82%,#FFFBEB 100%);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.app-header::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;pointer-events:none;
  background:linear-gradient(180deg,#FFFBEB,rgba(255,251,235,0))}
.header-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:34px;height:34px;flex:0 0 auto;display:block}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-name{margin:0;font-size:21px;font-weight:900;letter-spacing:-1px;white-space:nowrap;color:#5A4F45}
.brand-name em{font-style:normal;color:var(--pink);letter-spacing:-1px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.round-btn{
  position:relative;width:42px;height:42px;border-radius:50%;border:1px solid rgba(240,226,196,.9);
  background:linear-gradient(180deg,#FFFEFA,#FFF7E4); display:grid;place-items:center;
  font-size:17px;color:#6B5D4A;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s;
}
.round-btn:active{transform:scale(.94)}
.save-dot{position:absolute;right:6px;bottom:7px;width:9px;height:9px;border-radius:50%;background:#7FC79A;border:2px solid #FFFCF1;box-shadow:0 0 0 1px rgba(127,199,154,.35)}
.header-sub{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.today{font-size:14px;font-weight:800;color:#5F5445;letter-spacing:-.3px}
.today-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.mini-pill{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  background:linear-gradient(180deg,#FFFDF6,#FFF8E6);border:1px solid #F1E3BE;color:#9A7F42;
  font-size:11px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow-sm)
}

/* ---------- views ---------- */
#viewRoot{flex:1;padding:2px 16px 118px}
body.chat-open #viewRoot{padding-bottom:214px}
.view{display:none}
.view.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-hero{display:flex;align-items:center;gap:10px;padding:4px 2px 13px}
.view-hero h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.8px;color:#544A3F}
.view-hero p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.55;max-width:258px;word-break:keep-all}
.heroart{width:56px;height:56px;margin-left:auto;flex:0 0 auto;opacity:.96}
.heroart svg{width:100%;height:100%;display:block}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow-sm);margin:0 0 14px;
}
.card.tinted{background:linear-gradient(165deg,#FFFEF9,#FFFAEC)}
.card.greenish{background:linear-gradient(165deg,#FBFEF8,#F1FAF2);border-color:#DEEFE1}
.card.pinkish{background:linear-gradient(165deg,#FFFAFB,#FFF1F5);border-color:#FADDE7}
.card.blueish{background:linear-gradient(165deg,#FAFDFF,#EFF7FE);border-color:#DDEBF8}
.card.lav{background:linear-gradient(160deg,#FFFDFF,#F8F1FF);border-color:#EEE2F8}
.sec-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:11px}
.sec-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;letter-spacing:-.4px}
.sec-desc{margin:5px 0 0;font-size:11.5px;line-height:1.55;color:var(--muted);word-break:keep-all}
.sec-head .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}
.sec-head .right .pill{margin:0}

/* ---------- pills, badges ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--yellow-soft);border:1px solid #F0E0AF;color:#8B7332;white-space:nowrap;line-height:1.2}
.pill.pink{background:var(--pink-soft);border-color:#F8D7E2;color:#B25677}
.pill.green{background:var(--green-soft);border-color:#CFEBD8;color:#3F7D57}
.pill.blue{background:var(--blue-soft);border-color:#D6E8F8;color:#3D6E96}
.pill.gray{background:#F8F5ED;border-color:#EDE5D4;color:#8B8171}
.pill.solid{background:#FFF3D2;border-color:#F3E0A6}
.count-pill{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1px solid var(--line);background:#FFFDF8;color:#5E5347;font-size:12.5px;font-weight:800;
  padding:10px 13px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;box-shadow:0 2px 5px rgba(205,183,135,.10);transition:transform .12s ease,filter .15s;line-height:1.25;
  letter-spacing:-.2px}
.btn:active{transform:scale(.97)}
.btn-sm{padding:7px 10px;font-size:11.5px;border-radius:11px}
.btn-block{width:100%}
.btn-primary{background:linear-gradient(180deg,#F0FBF3,#E1F4E8);border-color:#CBEAD6;color:#3C7A54}
.btn-pink{background:linear-gradient(180deg,#FFF3F7,#FDE6EE);border-color:#F8D3E0;color:#B0516F}
.btn-blue{background:linear-gradient(180deg,#F4FAFF,#E6F2FC);border-color:#D4E7F8;color:#3C6D95}
.btn[disabled]{opacity:.5;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid #EFE5CF;background:#FFFDF7;color:#7C7161;font-size:11.5px;font-weight:700;
  padding:6px 11px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:#FFF3D3;border-color:#EBD79B;color:#7C6222;box-shadow:inset 0 0 0 1px rgba(235,215,155,.6)}
.chip[disabled]{opacity:.38;pointer-events:none}

/* ---------- avatar ---------- */
.avatar{width:52px;height:52px;border-radius:50%;background:#FFFDF7;border:2px solid #F1E5C8;display:grid;place-items:center;
  overflow:hidden;flex:0 0 auto;box-shadow:0 2px 6px rgba(205,183,135,.14)}
.avatar svg{width:44px;height:44px;display:block}
.avatar.mom{border-color:#F8DACE;background:#FFFCF2}
.avatar.dad{border-color:#CFE3F5;background:#FBFDFF}
.avatar.sm{width:38px;height:38px}.avatar.sm svg{width:32px;height:32px}
.avatar.xs{width:30px;height:30px;border-width:1.5px}.avatar.xs svg{width:25px;height:25px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.avatar.tapable{cursor:pointer;position:relative;transition:transform .12s ease;overflow:visible}
.avatar.tapable:active{transform:scale(.93)}
.avatar.tapable::after{content:"";position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;
  background:#FFFEFA url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239E8B72' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'><path d='M4 8.8A2.6 2.6 0 0 1 6.6 6.2h1.3l1-1.7h6.2l1 1.7h1.3A2.6 2.6 0 0 1 20 8.8v6.8a2.6 2.6 0 0 1-2.6 2.6H6.6A2.6 2.6 0 0 1 4 15.6z'/><circle cx='12' cy='12' r='3'/></svg>") center/10.5px 10.5px no-repeat;
  border:1px solid #EDE0C4;box-shadow:0 1px 3px rgba(180,150,90,.2)}
.mini-av img{width:16px;height:16px;border-radius:50%;object-fit:cover;margin-left:-3px;border:1px solid #F1E5C8;background:#fff}
.mini-av img:first-child{margin-left:0}
.sec-title .ch-ico{width:18px;height:18px;flex:0 0 auto;display:block}
.sec-title .ch-ico svg{width:100%;height:100%;display:block}
.done-stamp{width:26px;height:26px;display:block;transform:rotate(-8deg);opacity:.95}

/* ---------- weather ---------- */
.weather{cursor:pointer;background:linear-gradient(160deg,#FDFEFF 0%,#F3FAFF 55%,#FFFDF3 100%);border-color:#E3EFF9;position:relative;overflow:hidden}
.weather:active{filter:brightness(.99)}
.weather::after{content:"";position:absolute;width:120px;height:120px;right:-40px;top:-50px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,226,150,.45),rgba(255,226,150,0) 70%)}
.w-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;position:relative}
.w-icon{font-size:20px;line-height:1}
.w-city{font-size:13.5px;font-weight:800;color:#5B5245}
.w-temp{font-size:13.5px;font-weight:900;color:#3F617D}
.w-cond{font-size:11.5px;color:#7C8B99;font-weight:700}
.w-range{font-size:10.5px;color:#9AA6B1;font-weight:600;margin-left:1px}
.w-top .pill{margin-left:auto}
.w-bottom{display:flex;align-items:center;gap:8px;margin-top:10px;position:relative;flex-wrap:wrap}
.w-memo{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:#FFFDF6;border:1px solid #F0E6D2;
  border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:#8B7B58;max-width:62%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-upd{font-size:9.5px;color:#AFB8BF;font-weight:600}

/* ---------- family ---------- */
.member{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.9);margin-bottom:8px;box-shadow:0 1px 4px rgba(205,183,135,.07)}
.member:last-child{margin-bottom:0}
.member.tone-taekmin{background:linear-gradient(120deg,#FFFDF8,#FFF7E4)}
.member.tone-mom{background:linear-gradient(120deg,#FFFBFA,#FFF4F8)}
.member.tone-dad{background:linear-gradient(120deg,#FBFDFF,#F2F9FF)}
.m-info{min-width:0;flex:1}
.m-name{font-size:15.5px;font-weight:900;letter-spacing:-.5px;color:#514738}
.m-sub{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-stats{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.m-star{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:900;color:#514738;line-height:1}
.m-star svg{width:19px;height:19px;display:block}
.m-piggy{display:flex;align-items:center;gap:3px;font-size:10px;color:#A2907A;font-weight:700;white-space:nowrap}
.m-piggy b{color:#8B6E4B;font-size:10.5px}
.m-piggy .emo{font-size:11px}

/* ---------- stamp board ---------- */
.stamp-card{background:linear-gradient(150deg,#FFFEFD 0%,#FBF6FF 100%);border-color:#F0E4F8}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.day-label{font-size:10px;font-weight:800;color:#B4A794}
.day-label.sun{color:#D79A9A}
.stamp-slot{width:100%;aspect-ratio:1/1;max-width:40px;border-radius:50%;border:2px dashed #E9DCC0;background:rgba(255,255,255,.6);
  display:grid;place-items:center;position:relative;padding:0;cursor:default}
.stamp-slot svg{width:82%;height:82%}
.stamp-slot.on{border:2px solid #BFE3F7;background:#fff;box-shadow:0 2px 8px rgba(140,188,228,.25),inset 0 0 0 2px #fff}
.stamp-slot.today{border-style:dashed;border-color:#E9CFA0}
.stamp-slot.today:not(.on){background:#FFF9E7}
.stamp-slot.today.on{border-style:solid}
.stamp-slot.clickable{cursor:pointer}
.stamp-slot.clickable:active{transform:scale(.94)}
.stamp-slot .today-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8.5px;font-weight:800;color:#C39A62;letter-spacing:-.4px;line-height:1;white-space:nowrap}
.stamp-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.stamp-foot .btn{margin-left:auto}

/* ---------- mission ---------- */
.mission{background:linear-gradient(160deg,#FFFAFB 0%,#FFF1F5 100%);border-color:#FADCE6}
.mission-emoji{font-size:30px;line-height:1;margin:2px 0 8px}
.av-pick{display:flex;justify-content:center;padding:6px 0 4px}
.av-pick .avatar{width:104px;height:104px;border-width:3px}
.av-pick .avatar svg{width:88px;height:88px}
.mission-title{font-size:16.5px;font-weight:900;letter-spacing:-.5px;color:#5A4A44;margin-bottom:12px;word-break:keep-all}
.mission-title.done{color:#B9AFA6;text-decoration:line-through}
.mission-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mission-note{margin:10px 0 0;font-size:10.5px;color:#B3A6A1;line-height:1.5}

/* ---------- todo ---------- */
.todo-group{border-radius:16px;border:1px solid #F1E6CE;background:linear-gradient(160deg,#FFFDF8,#FFF9EC);padding:12px;margin-bottom:10px}
.todo-group.mom{background:linear-gradient(160deg,#FFFBFC,#FFF3F7);border-color:#F7E1E8}
.todo-group.dad{background:linear-gradient(160deg,#FBFDFF,#F1F9FF);border-color:#DDEBF7}
.tg-head{display:flex;align-items:center;gap:9px;padding-bottom:9px;border-bottom:1px dashed #EEE3CC;margin-bottom:2px}
.tg-name{font-size:14.5px;font-weight:900;letter-spacing:-.4px;color:#524839}
.tg-prog{font-size:10.5px;color:var(--muted);margin-top:1px;font-weight:600}
.tg-bar{margin-left:auto;width:56px;height:5px;border-radius:999px;background:#EFEADB;overflow:hidden}
.tg-bar i{display:block;height:100%;background:linear-gradient(90deg,#A8DEB9,#7FC79A);border-radius:999px}
.todo-group.mom .tg-bar i{background:linear-gradient(90deg,#F9C3D2,#E78CA8)}
.todo-group.dad .tg-bar i{background:linear-gradient(90deg,#A9D4F2,#8CBCE4)}
.todo-list{padding:2px 0}
.row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed #EFE6D2;min-height:38px}
.row:last-child{border-bottom:0;padding-bottom:2px}
.row-txt{flex:1;min-width:0;font-size:13.5px;line-height:1.4;color:#57503F;word-break:keep-all}
.row-txt.done{color:#BEB5A7;text-decoration:line-through}
.row-acts{display:flex;gap:4px;flex:0 0 auto}
.ibtn{width:28px;height:28px;border-radius:10px;border:1px solid #EFE5D1;background:#FFFDF8;display:grid;place-items:center;
  font-size:12px;cursor:pointer;padding:0;color:#B49A8C;transition:transform .12s,background .15s;line-height:1}
.ibtn:active{transform:scale(.92)}
.ibtn.pin.on{background:#FFF1CE;border-color:#EDD89A}
.cbox{width:25px;height:25px;border-radius:8px;border:2px solid #E1D5BB;background:#FFFDF8;display:grid;place-items:center;
  flex:0 0 auto;cursor:pointer;padding:0;transition:.15s;color:transparent}
.cbox svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cbox.on{background:#7FC79A;border-color:#7FC79A;color:#fff}
.cbox.blue.on{background:#8CBCE4;border-color:#8CBCE4}
.cbox:active{transform:scale(.92)}
.add-row{width:100%;margin-top:9px;padding:9px;border-radius:12px;border:1.5px dashed #E6D9BE;background:rgba(255,255,255,.5);
  color:#A48E6C;font-size:12px;font-weight:800;cursor:pointer;transition:.15s}
.add-row:active{background:#FFF6E2}

/* ---------- progress ---------- */
.prog{height:9px;border-radius:999px;background:#EFEADB;overflow:hidden;flex:1}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#A7D2EE,#7FB3E0);transition:width .35s}
.prog.green i{background:linear-gradient(90deg,#AFE2BF,#7FC79A)}
.prog.pink i{background:linear-gradient(90deg,#F9C6D4,#E78CA8)}
.prog-row{display:flex;align-items:center;gap:9px;margin:4px 0 10px}
.prog-row .num{font-size:11px;font-weight:800;color:#8E8578;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- study plan ---------- */
.two-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.plan-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #EFE6D2}
.plan-row:last-child{border-bottom:0}
.who-tag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:#F6F2E7;color:#95886F;flex:0 0 auto}
.who-tag.taekmin{background:#FFF3D9;color:#9A7C3C}
.who-tag.mom{background:#FDEBF1;color:#B06882}
.plan-row .pin-mark{font-size:10px;opacity:.65}

/* timer */
.timer{margin-top:13px;border:1.5px dashed #DCE8F6;border-radius:16px;padding:12px;background:linear-gradient(170deg,#FCFDFF,#FFFDF6)}
.seg{display:flex;gap:4px;background:#F6F3E9;border:1px solid #EFE8D6;border-radius:999px;padding:3px;width:100%}
.seg-btn{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-size:11.5px;font-weight:800;color:#9C9280;cursor:pointer;transition:.18s}
.seg-btn.on{background:#fff;color:#4A6D8C;box-shadow:0 2px 6px rgba(140,170,200,.18)}
.timer-sub{font-size:10.5px;color:#A7B2BE;font-weight:700;margin:11px 2px 2px;text-align:center}
.timer-clock{font-size:44px;font-weight:900;letter-spacing:-2px;color:#3E5E7C;text-align:center;line-height:1.06;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.timer-clock.warn{color:#D08B63}
.timer-actions{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:10px}
.timer-actions .btn{padding:11px;font-size:13px}
.timer-min{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.timer-min .chip{padding:5px 10px;font-size:11px}
.direct{display:flex;gap:5px;align-items:center;margin-left:auto}
.direct input{width:62px;padding:6px 8px;border-radius:10px;font-size:11.5px;text-align:center}
.direct .btn{padding:6px 8px;font-size:10.5px;border-radius:10px;white-space:nowrap}

/* ---------- study checklist ---------- */
.study-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sh-name{font-size:15px;font-weight:900;letter-spacing:-.4px}
.sh-prog{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.coin-badge{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:#FFF6D9;border:1px solid #F0E0AC;
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:900;color:#8A7133;white-space:nowrap}
.coin-badge svg{width:16px;height:16px}
.study-row{display:flex;gap:9px;padding:10px 0;border-bottom:1px dashed #EFE6D2}
.study-row:last-child{border-bottom:0}
.study-main{flex:1;min-width:0}
.study-title{font-size:13.5px;font-weight:700;color:#57503F;line-height:1.4;word-break:keep-all}
.study-title.done{color:#BEB5A7;text-decoration:line-through}
.study-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:#FBF6E6;border:1px solid #F1E7CE;color:#9A8A66;white-space:nowrap}
.tag.money{background:#FFF4D4;border-color:#F0DFA8;color:#8C7027;display:inline-flex;align-items:center;gap:3px}
.tag.money svg{width:11px;height:11px}
.study-acts{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;justify-content:center}
.study-acts .ibtn{width:26px;height:26px;border-radius:9px;font-size:11px}
.study-total{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:10px;border-top:1px dashed #EFE6D2;font-size:11.5px;color:#8C8272;font-weight:700}
.study-total b{color:#8A7133;font-weight:900}

/* ---------- date nav ---------- */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;background:#FFFDF7;border:1px solid var(--line);
  border-radius:14px;padding:7px 9px;box-shadow:var(--shadow-sm)}
.date-nav .nav-btn{width:30px;height:30px;border-radius:9px;border:1px solid #EFE5D1;background:#FFFDF8;color:#9A8C74;
  font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.date-nav .nav-btn[disabled]{opacity:.35;pointer-events:none}
.date-nav .dn-label{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:#5C5245}
.date-nav .dn-label span{display:block;font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}

/* ---------- meals ---------- */
.meal-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow-sm);margin-bottom:10px}
.meal-head{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.meal-emoji{font-size:17px;line-height:1}
.meal-head b{font-size:13.5px;font-weight:900;letter-spacing:-.3px;color:#574D3F}
.meal-time{margin-left:auto;font-size:10px;color:#B4A995;font-weight:700}
.meal-card textarea{min-height:52px;background:#FFFCF4;font-size:13px;padding:9px 11px;border-radius:12px}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.quick .chip{font-size:10px;padding:4px 9px;background:#FFFDF8}
.meal-empty{font-size:11px;color:#C0B7A6}

/* ---------- schedule ---------- */
.sch-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;background:#FFFEF9;border:1px solid #F2E8D2;margin-bottom:8px;box-shadow:0 1px 4px rgba(205,183,135,.07)}
.sch-item.past{opacity:.55}
.sch-date{width:44px;flex:0 0 auto;text-align:center;border-right:1px dashed #EEE3CC;padding-right:8px}
.sch-date b{display:block;font-size:15px;font-weight:900;color:#5C5245;line-height:1.1;font-variant-numeric:tabular-nums}
.sch-date span{font-size:9.5px;color:#A99C87;font-weight:700}
.sch-main{flex:1;min-width:0}
.sch-title{font-size:13.5px;font-weight:800;color:#544B3E;word-break:keep-all}
.sch-meta{font-size:10.5px;color:#A4988A;margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sch-meta .mini-av{display:inline-flex;gap:-2px}
.mini-av{display:inline-flex;align-items:center}
.mini-av svg{width:16px;height:16px;margin-left:-3px}
.mini-av svg:first-child{margin-left:0}

/* ---------- health ---------- */
.med-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:2px}
.med-tile{position:relative;border:1.5px solid #EFE3CB;background:#FFFDF8;border-radius:16px;transition:.15s;overflow:hidden}
.med-tile.on{background:linear-gradient(180deg,#F1FBF4,#E3F5E9);border-color:#C7E8D3;box-shadow:0 2px 10px rgba(127,199,154,.16)}
.med-main{width:100%;border:0;background:transparent;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s}
.med-main .med-emoji{font-size:22px;line-height:1}
.med-main b{font-size:13px;font-weight:900;color:#5B5142;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.med-main .med-time{font-size:9.5px;color:#B0A491;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.med-tile.on .med-main b{color:#3C7A54}
.med-tile.on .med-main .med-time{color:#79AE8D}
.med-main:active{transform:scale(.97)}
.med-pen{position:absolute;top:3px;right:3px;width:25px;height:25px;border-radius:9px;border:0;background:rgba(255,253,247,.92);color:#BDB19D;font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 3px rgba(205,183,135,.16)}
.med-pen:active{transform:scale(.9);background:#FFF3DA}
.cond-row{display:flex;gap:6px;margin:2px 0 12px}
.cond-row .chip{flex:1;text-align:center;padding:9px 4px;font-size:11.5px}
.temp-wrap{display:flex;align-items:center;gap:6px}
.temp-wrap input[type=number]{width:92px;text-align:center;font-size:15px;font-weight:800;color:#4A6D8C}
.temp-wrap .unit{font-size:12px;color:#A79C88;font-weight:700}
.grow-now{display:flex;align-items:flex-end;gap:16px;padding:2px 2px 10px;border-bottom:1px dashed #EFE6D2;margin-bottom:4px;flex-wrap:wrap}
.grow-now .gl{font-size:10px;font-weight:800;color:#A79C8A;display:block;margin-bottom:1px}
.grow-now .gv{font-size:26px;font-weight:900;letter-spacing:-1px;color:#4E7A5C;font-variant-numeric:tabular-nums;line-height:1.05}
.grow-now .gu{font-size:12px;font-weight:800;color:#79AE8D;margin-left:1px}
.grow-now .grow-stamp{margin-left:auto;text-align:right}
.grow-now .gs-date{font-size:12px;font-weight:800;color:#8E8373;font-variant-numeric:tabular-nums}
.rec-list{margin-top:2px}
.rec-row{display:flex;align-items:center;gap:9px;width:100%;border:0;border-bottom:1px dashed #EFE6D2;background:transparent;padding:9px 2px;cursor:pointer;text-align:left}
.rec-row:last-child{border-bottom:0}
.rec-row:active{background:#FCF8EE}
.rec-date{flex:0 0 auto;width:44px;font-size:11px;font-weight:800;color:#8E8373;font-variant-numeric:tabular-nums}
.rec-main{flex:1;min-width:0;display:block}
.rec-title{display:block;font-size:12.5px;font-weight:800;color:#5A5143;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-sub{display:block;font-size:10.5px;color:#B0A795;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-chev{flex:0 0 auto;color:#D6CCBA;font-size:15px;font-weight:800}
.kind-pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:9.5px;font-weight:800;line-height:1.4}
.kind-pill.hosp{background:#EAF4FC;color:#3D6E96;border:1px solid #D6E8F8}
.kind-pill.vac{background:#FDEDF2;color:#B25677;border:1px solid #F8D7E2}
.history{margin-top:4px}
.h-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #EFE6D2;font-size:11.5px;color:#7C7264}
.h-row:last-child{border-bottom:0}
.h-row .h-date{width:52px;flex:0 0 auto;font-weight:800;color:#8E8373;font-variant-numeric:tabular-nums}
.h-med{font-weight:800;color:#7FA98C;font-variant-numeric:tabular-nums}
.h-dot{width:7px;height:7px;border-radius:50%;background:#E4DCCB;display:inline-block}
.h-dot.on{background:#7FC79A}
.h-memo{margin-left:auto;color:#B0A795;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}

/* ---------- praise ---------- */
.praise-form textarea{min-height:64px}
.praise-feed{margin-top:4px}
.praise-item{display:flex;gap:9px;padding:11px 0;border-bottom:1px dashed #EFE6D2}
.praise-item:last-child{border-bottom:0}
.praise-body{flex:1;min-width:0}
.praise-top{display:flex;align-items:center;gap:5px;font-size:11px;color:#A4988A;font-weight:700}
.praise-top b{color:#6C6152;font-size:12px;font-weight:900}
.praise-msg{margin-top:4px;font-size:13px;color:#5A5143;line-height:1.5;word-break:keep-all}
.praise-star{font-size:15px;flex:0 0 auto;align-self:flex-start;margin-top:2px}

/* ---------- money ---------- */
.money-card{position:relative;overflow:hidden;background:linear-gradient(150deg,#FFFBEC 0%,#FFF3D2 55%,#FFEDC7 100%);
  border:1px solid #F2E0B0;border-radius:22px;padding:18px;box-shadow:0 8px 22px rgba(214,178,102,.18);margin-bottom:14px}
.money-card::after{content:"";position:absolute;right:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.4)}
.mc-label{font-size:11.5px;font-weight:800;color:#A08549}
.mc-amount{font-size:31px;font-weight:900;letter-spacing:-1.4px;color:#6C531F;margin-top:3px;font-variant-numeric:tabular-nums}
.mc-amount span{font-size:15px;font-weight:800;margin-left:2px;color:#8C7134}
.mc-pig{position:absolute;right:14px;top:14px;width:62px;height:62px;opacity:.95}
.mc-stats{display:flex;gap:16px;margin-top:14px;position:relative}
.mc-stats div{font-size:10.5px;color:#A08951;font-weight:700}
.mc-stats b{display:block;font-size:13px;font-weight:900;color:#6E5620;margin-top:2px}
.ledger{margin-top:2px}
.l-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed #EFE6D2}
.l-row:last-child{border-bottom:0}
.l-main{flex:1;min-width:0}
.l-memo{font-size:12.5px;font-weight:700;color:#5A5143;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-sub{font-size:10px;color:#B0A795;margin-top:2px}
.l-amt{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.l-amt.in{color:#4E9768}
.l-amt.out{color:#C4788E}
.l-del{width:26px;height:26px;border-radius:9px;border:0;background:transparent;color:#D3C8B6;font-size:12px;cursor:pointer;flex:0 0 auto}

/* ---------- chat ---------- */
.sender-card{background:linear-gradient(160deg,#FDFEFF,#F4FAFF);border-color:#DFEBF6}
.sender-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sender-chip{display:flex;align-items:center;gap:6px;justify-content:center;padding:7px 6px;border-radius:14px;border:1.5px solid #E9EEF2;
  background:#fff;cursor:pointer;font-size:12px;font-weight:800;color:#8B8274;transition:.15s}
.sender-chip .avatar{width:26px;height:26px;border-width:1.5px}
.sender-chip .avatar svg{width:22px;height:22px}
.sender-chip.on{border-color:#A7CFEC;background:#F5FBFF;color:#3E6D95;box-shadow:0 2px 8px rgba(140,188,228,.16)}
.sender-chip.locked{opacity:.42;cursor:not-allowed}
.sender-chip:active{transform:scale(.97)}
.lock-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.lock-note{font-size:10px;color:#A9B2BB;line-height:1.45;flex:1;min-width:120px}
.lock-btn{margin-left:auto}
.chat-list{display:flex;flex-direction:column;gap:13px;padding:2px 0 6px}
.chat-day{align-self:center;font-size:10px;font-weight:800;color:#B3A995;background:rgba(255,253,244,.9);
  border:1px solid #F0E6D0;border-radius:999px;padding:4px 12px}
.msg{display:flex;gap:7px;align-items:flex-start;max-width:100%}
.msg.own{flex-direction:row-reverse}
.msg-col{max-width:76%;min-width:0;display:flex;flex-direction:column}
.msg.own .msg-col{align-items:flex-end}
.msg-meta{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#B0A793;margin:0 2px 4px;font-weight:700}
.msg-name{font-size:10.5px;font-weight:900;color:#7E7362}
.bubble{background:#fff;border:1px solid #F1E7D2;border-radius:16px;border-top-left-radius:5px;padding:10px 13px;
  font-size:13.5px;line-height:1.55;color:#544C40;box-shadow:0 2px 6px rgba(205,183,135,.10);word-break:keep-all;overflow-wrap:anywhere}
.msg.own .bubble{background:linear-gradient(180deg,#FFF8DD,#FDEFC5);border-color:#F1E1AB;border-top-left-radius:16px;border-top-right-radius:5px;color:#5C4C2A}
.bubble.sticker{background:transparent;border:0;box-shadow:none;padding:0}
.bubble.sticker svg{width:118px;height:118px;display:block;filter:drop-shadow(0 3px 6px rgba(180,150,100,.18))}
.msg-reacts{display:flex;gap:5px;margin-top:5px;padding:0 2px}
.react{display:inline-flex;align-items:center;gap:3px;border:1px solid #F0E6D1;background:#FFFCF3;border-radius:999px;
  padding:3px 8px;font-size:10px;cursor:pointer;color:#B7A692;line-height:1.1;transition:.15s}
.react svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.react.on{background:#FFEFF3;border-color:#F8D4DE;color:#D9738F}
.react.on svg{fill:#EF8FA8;stroke:#EF8FA8}
.react.del:active{background:#F6EFE2}
.chat-empty{text-align:center;color:#B7AD9B;font-size:12px;padding:22px 0}
.chat-empty svg{width:88px;height:88px;margin:0 auto 6px;display:block;opacity:.9}

/* composer */
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:100%;max-width:460px;
  z-index:26;display:none;padding:6px 12px 8px;background:linear-gradient(180deg,rgba(255,250,235,0),rgba(255,249,232,.94) 30%,#FFF9E6 70%)}
.composer.on{display:block}
.sticker-panel{display:none;grid-template-columns:repeat(6,1fr);gap:4px;background:#FFFDF6;border:1px solid #F0E6D0;
  border-radius:16px;padding:9px 8px;margin-bottom:7px;box-shadow:var(--shadow)}
.sticker-panel.on{display:grid;animation:fade .18s}
.sticker-panel button{border:0;background:transparent;padding:2px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.sticker-panel button:active{background:#FFF4DE}
.sticker-panel svg{width:100%;max-width:44px;height:44px}
.composer-row{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #EFE3C9;border-radius:999px;padding:5px 6px 5px 12px;
  box-shadow:0 4px 14px rgba(200,175,125,.16)}
.composer-row input{flex:1;border:0;background:transparent;padding:7px 2px;font-size:13.5px;outline:none;min-width:0}
.comp-btn{width:34px;height:34px;border-radius:50%;border:0;background:#FFF6DD;display:grid;place-items:center;font-size:16px;cursor:pointer;flex:0 0 auto}
.send-btn{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(180deg,#FFE7A8,#FAD37F);color:#7A5F1E;
  font-size:16px;font-weight:900;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;z-index:30;
  display:grid;grid-template-columns:repeat(8,1fr);gap:1px;padding:7px 5px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,251,235,.75),#FFF9E5 34%,#FFF7DF);
  border-top:1px solid rgba(240,228,198,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 0 3px;border-radius:13px;color:#B7AB96;font-size:9.5px;font-weight:800;cursor:pointer;transition:.15s;letter-spacing:-.3px}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#6B5A3E;background:linear-gradient(180deg,#FFFDF4,#FFF3D3);box-shadow:0 2px 8px rgba(205,183,135,.28)}
.tab.on svg{stroke-width:1.95}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.overlay{position:absolute;inset:0;background:rgba(74,63,45,.36);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:460px;background:#FFFDF7;border-radius:24px 24px 0 0;padding:10px 18px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;box-shadow:0 -10px 34px rgba(120,95,50,.2);animation:slideup .26s cubic-bezier(.22,.8,.3,1)}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#E9DEC5;margin:4px auto 12px}
.sheet-head h2{margin:0 0 4px;font-size:17px;font-weight:900;letter-spacing:-.6px;color:#4E463B}
.sheet-head p{margin:0 0 12px;font-size:11.5px;color:var(--muted);line-height:1.55}
.sheet-body{padding-bottom:2px}
.sheet-foot{display:flex;gap:8px;margin-top:14px}
.sheet-foot .btn{flex:1}
.set-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #EFE6D2}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:13px;font-weight:900;color:#544B3E}
.set-row p{margin:3px 0 0;font-size:10.5px;color:var(--muted);line-height:1.5}
.set-row .btn{flex:0 0 auto}
.note{margin:12px 0 0;font-size:10.5px;line-height:1.6;color:#A79C8A;background:#FBF7EC;border:1px solid #F1E7D1;border-radius:12px;padding:10px 12px}
.about{margin-top:12px;text-align:center;font-size:10px;color:#BCB2A0;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.field>span{font-size:11.5px;font-weight:800;color:#7D7264}
.field .hint{font-size:10px;color:#B3A997;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea,select{
  font:inherit;font-size:13.5px;color:var(--ink);background:#FFFCF5;border:1.5px solid #EFE4CC;border-radius:12px;
  padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none
}
input:focus,textarea:focus,select:focus{border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(247,185,200,.2)}
textarea{resize:none;line-height:1.55}
select{background-image:linear-gradient(45deg,transparent 50%,#B9AC95 50%),linear-gradient(135deg,#B9AC95 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{flex:1;text-align:center;font-size:13.5px;font-weight:900;color:#5A5043}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{text-align:center;font-size:9.5px;font-weight:800;color:#B4A794;padding:2px 0}
.cal-cell{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:#FBF8F0;color:#8E8577;
  font-size:11px;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0;position:relative;font-variant-numeric:tabular-nums}
.cal-cell.blank{background:transparent;pointer-events:none}
.cal-cell.on{background:#F2FAFF;border-color:#C3E2F5;color:#3F6C8E}
.cal-cell.on svg{width:78%;height:78%}
.cal-cell.today{outline:2px solid #F3C98B;outline-offset:1px}
.cal-cell:active{transform:scale(.94)}
.cal-legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:10.5px;color:#A79C8A;flex-wrap:wrap}
.cal-legend .btn{margin-left:auto}
.mission-pick{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dashed #EFE6D2;font-size:12.5px;color:#6E6455}
.mission-pick:last-child{border-bottom:0}
.mission-pick .emo{font-size:16px}
.mission-pick .pill{margin-left:auto}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:120;
  background:rgba(72,62,47,.94);color:#FFF9EC;font-size:12px;font-weight:700;padding:10px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:88%;text-align:center;line-height:1.45;
  box-shadow:0 8px 24px rgba(60,45,20,.28)}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.chat-open .toast{bottom:calc(168px + env(safe-area-inset-bottom))}

/* misc */
.empty{text-align:center;padding:20px 10px;color:#B7AD9B;font-size:11.5px;line-height:1.6}
.empty svg{width:76px;height:76px;display:block;margin:0 auto 4px;opacity:.85}
.section-gap{height:4px}
.sub-label{font-size:11px;font-weight:800;color:#9C907C;margin:14px 2px 7px;display:flex;align-items:center;gap:6px}
.sub-label:first-child{margin-top:0}
.divider{height:1px;background:linear-gradient(90deg,rgba(240,230,210,0),#F0E6D2,rgba(240,230,210,0));margin:12px 0}
:focus-visible{outline:2px solid #E9B7C6;outline-offset:2px}
@media (max-width:360px){
  .brand-name{font-size:19px}
  .m-star{font-size:15px}
  .timer-clock{font-size:38px}
  .tab{font-size:9px}
}
@media (min-width:520px){
  body{background:#F2E7D0}
  .app{border-left:1px solid #F0E4C8;border-right:1px solid #F0E4C8;box-shadow:0 0 60px rgba(160,130,80,.16)}
  .sheet{border-radius:24px;margin-bottom:6vh;max-height:82vh}
  .overlay{align-items:center}
}

<script>
(function(){
'use strict';

/* =========================================================
   기본 상수와 도우미
   ========================================================= */
var STORAGE_KEY='family-record:taekmin:v1';
var WEEK=['월','화','수','목','금','토','일'];
var WEEK_FULL=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
var MEMBERS=[
  {id:'taekmin',name:'택민이',sub:'모몽가와 함께',avatar:'ch-taekmin'},
  {id:'mom',name:'엄마',sub:'모몽가와 함께',avatar:'ch-mom'},
  {id:'dad',name:'아빠',sub:'모몽가와 함께',avatar:'ch-dad'}
];
var MEMBER_MAP={};
MEMBERS.forEach(function(m){MEMBER_MAP[m.id]=m});
var AVATAR_KEY='family-record:taekmin:avatars:v1';
var avatarPhotos={};
(function loadAvatars(){
  try{
    var raw=window.localStorage.getItem(AVATAR_KEY);
    if(!raw) return;
    var parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object') return;
    MEMBERS.forEach(function(m){
      var v=parsed[m.id];
      if(typeof v==='string'&&v.slice(0,11)==='data:image/') avatarPhotos[m.id]=v;
    });
  }catch(e){}
})();
function avatarPhoto(id){ return avatarPhotos[id]||'' }
function saveAvatars(){
  try{ window.localStorage.setItem(AVATAR_KEY,JSON.stringify(avatarPhotos)); return true; }
  catch(e){ return false; }
}
function avatarMarkup(id){
  var m=MEMBER_MAP[id]||MEMBER_MAP.taekmin;
  var photo=avatarPhoto(m.id);
  if(photo) return '<img src="'+photo+'" alt="'+esc(m.name)+'">';
  return '<svg viewBox="0 0 100 100"><use href="#'+m.avatar+'"/></svg>';
}
var MISSIONS=[
  {id:'m1',e:'🥕',t:'저녁 준비 같이 돕기'},
  {id:'m2',e:'🧹',t:'거실 10분 같이 정리하기'},
  {id:'m3',e:'🎲',t:'가족 보드게임 한 판'},
  {id:'m4',e:'🚶',t:'다 같이 동네 한 바퀴 산책하기'},
  {id:'m5',e:'🍎',t:'가족 간식 같이 만들기'},
  {id:'m6',e:'📖',t:'가족 독서 10분'},
  {id:'m7',e:'🧦',t:'빨래 같이 개기'},
  {id:'m8',e:'💬',t:'오늘 기분 한마디씩 나누기'},
  {id:'m9',e:'🍽️',t:'설거지 같이 하기'},
  {id:'m10',e:'🌙',t:'잘 자 인사 함께 하기'}
];
var WEATHER_PRESETS=[
  {icon:'☀️',cond:'맑음',temp:11,low:6,high:15,dust:'보통',pm:'나쁨'},
  {icon:'🌤️',cond:'구름 조금',temp:13,low:8,high:17,dust:'보통',pm:'보통'},
  {icon:'☁️',cond:'흐림',temp:9,low:5,high:12,dust:'좋음',pm:'보통'},
  {icon:'🌧️',cond:'비',temp:8,low:6,high:11,dust:'좋음',pm:'좋음'}
];

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var a=String(s).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1)}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function startOfWeek(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);var k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function fmtMoney(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'}
function uid(p){return (p||'id')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function timeLabel(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d.getTime())) return '';
  var h=d.getHours(), m=pad(d.getMinutes()), ap=h<12?'오전':'오후';
  h=h%12; if(h===0) h=12;
  return ap+' '+h+':'+m;
}
function dateLabel(ds){
  var t=ymd(), d=parseYmd(ds);
  if(ds===t) return '오늘';
  if(ds===ymd(addDays(new Date(),-1))) return '어제';
  return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WEEK[(d.getDay()+6)%7]+')';
}
function nextWeekday(target){
  var d=new Date(); d.setHours(0,0,0,0);
  var diff=(target-d.getDay()+7)%7;
  if(diff===0) diff=7;
  return ymd(addDays(d,diff));
}

function normalize(s){
  var d=defaultState();
  if(!s||typeof s!=='object') return d;
  var out={};
  Object.keys(d).forEach(function(k){out[k]=(s[k]===undefined?d[k]:s[k])});
  out.members={};
  Object.keys(d.members).forEach(function(k){out.members[k]={stars:(s.members&&s.members[k]&&Number(s.members[k].stars))||0}});
  out.todos={};
  Object.keys(d.todos).forEach(function(k){out.todos[k]=Array.isArray(s.todos&&s.todos[k])?s.todos[k]:d.todos[k]});
  out.plan={items:(s.plan&&Array.isArray(s.plan.items))?s.plan.items:d.plan.items};
  out.study={items:(s.study&&Array.isArray(s.study.items))?s.study.items:d.study.items};
  out.timer=Object.assign({},d.timer,s.timer||{});
  out.mission=Object.assign({},d.mission,s.mission||{});
  out.chatMeta=Object.assign({},d.chatMeta,s.chatMeta||{});
  out.weather=Object.assign({},d.weather,s.weather||{});
  out.meals=s.meals&&typeof s.meals==='object'?s.meals:{};
  out.health=s.health&&typeof s.health==='object'?s.health:{};
  out.meds=(Array.isArray(s.meds)?s.meds:defaultMeds()).map(function(m){
    m=(m&&typeof m==='object')?m:{};
    return {
      id:typeof m.id==='string'&&m.id?m.id:uid('md'),
      name:typeof m.name==='string'&&m.name?m.name:'약',
      time:typeof m.time==='string'?m.time:'',
      emoji:typeof m.emoji==='string'&&m.emoji?m.emoji:'💊',
      slot:(m.slot==='morning'||m.slot==='evening')?m.slot:''
    };
  });
  out.growth=(Array.isArray(s.growth)?s.growth:[]).map(function(g){
    g=(g&&typeof g==='object')?g:{};
    return {
      id:typeof g.id==='string'&&g.id?g.id:uid('gr'),
      date:typeof g.date==='string'&&g.date?g.date:ymd(),
      height:g.height===0?'':String(g.height===undefined||g.height===null?'':g.height),
      weight:g.weight===0?'':String(g.weight===undefined||g.weight===null?'':g.weight),
      memo:typeof g.memo==='string'?g.memo:''
    };
  });
  out.clinic=(Array.isArray(s.clinic)?s.clinic:[]).map(function(c){
    c=(c&&typeof c==='object')?c:{};
    return {
      id:typeof c.id==='string'&&c.id?c.id:uid('cl'),
      date:typeof c.date==='string'&&c.date?c.date:ymd(),
      kind:c.kind==='예방접종'?'예방접종':'병원',
      title:typeof c.title==='string'?c.title:'',
      memo:typeof c.memo==='string'?c.memo:''
    };
  });
  out.stamps=s.stamps&&typeof s.stamps==='object'?s.stamps:{};
  out.schedule=Array.isArray(s.schedule)?s.schedule:d.schedule;
  out.praise=Array.isArray(s.praise)?s.praise:[];
  out.ledger=Array.isArray(s.ledger)?s.ledger:[];
  out.chat=Array.isArray(s.chat)&&s.chat.length?s.chat:d.chat;
  out.piggyBase=Number.isFinite(Number(s.piggyBase))?Number(s.piggyBase):d.piggyBase;
  return out;
}

var storageOK=true;
function load(){
  var raw=null;
  try{
    raw=window.localStorage.getItem(STORAGE_KEY);
  }catch(e){
    storageOK=false;
    console.warn('브라우저 저장소를 쓸 수 없어요',e);
    return defaultState();
  }
  if(!raw) return defaultState();
  try{
    return normalize(JSON.parse(raw));
  }catch(e){
    console.warn('저장된 기록을 읽지 못했어요. 새 기록으로 시작해요.',e);
    return defaultState();
  }
}
var state=load();

function save(){
  try{
    state.updatedAt=new Date().toISOString();
    window.localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    var dot=document.getElementById('saveDot');
    if(dot){dot.style.background='#7FC79A'}
  }catch(e){
    storageOK=false;
    console.warn('저장하지 못했어요',e);
    var d=document.getElementById('saveDot');
    if(d){d.style.background='#E7A0A8'}
  }
}

function rollover(){
  var today=ymd();
  if(state.day===today) return false;
  state.day=today;
  Object.keys(state.todos).forEach(function(k){
    (state.todos[k]||[]).forEach(function(t){t.done=false});
  });
  state.plan.items=state.plan.items.filter(function(i){return i.fixed});
  state.plan.items.forEach(function(i){i.done=false});
  state.study.items.forEach(function(i){i.done=false});
  var pick=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];
  if(state.mission&&state.mission.id){var cur=MISSIONS.filter(function(m){return m.id===state.mission.id})[0];if(cur&&MISSIONS.length>1){var others=MISSIONS.filter(function(m){return m.id!==cur.id});pick=others[Math.floor(Math.random()*others.length)]}}
  state.mission={date:today,id:pick.id,together:(state.mission&&state.mission.together)||0,done:false};
  state.timer={mode:state.timer.mode,minutes:state.timer.minutes,running:false,remainingMs:state.timer.minutes*60000,endsAt:null,startAt:null,accMs:0,finished:false};
  save();
  return true;
}

function currentMission(){
  var id=state.mission&&state.mission.id;
  var m=MISSIONS.filter(function(x){return x.id===id})[0];
  return m||MISSIONS[0];
}
function isStamped(ds){return !!state.stamps[ds]}
function stampToday(auto){
  var t=ymd();
  if(state.stamps[t]) return false;
  state.stamps[t]={auto:!!auto,at:new Date().toISOString()};
  return true;
}
function streak(){
  var n=0, cur=new Date();
  if(!isStamped(ymd(cur))) cur=addDays(cur,-1);
  while(isStamped(ymd(cur))){n++; cur=addDays(cur,-1); if(n>3650) break;}
  return n;
}
function monthStampCount(offset){
  var base=new Date();
  if(offset){base=new Date(base.getFullYear(),base.getMonth()+(offset||0),1)}
  var y=base.getFullYear(), m=base.getMonth();
  var n=0, dim=daysInMonth(y,m);
  for(var i=1;i<=dim;i++){ if(isStamped(y+'-'+pad(m+1)+'-'+pad(i))) n++; }
  return n;
}
function ledgerSum(){
  return (state.ledger||[]).reduce(function(a,e){return a+(e.type==='in'?(Number(e.amount)||0):-(Number(e.amount)||0))},0);
}
function balance(id){
  if(id!=='taekmin') return 0;
  return (Number(state.piggyBase)||0)+ledgerSum();
}

  var el=document.getElementById('todayLine'); if(!el) return;
  var d=new Date();

function render(){
  var root=document.getElementById('viewRoot');
  if(!root) return;
  var fn=VIEWS[currentTab]||VIEWS.home;
  root.innerHTML='<div class="view active" data-view="'+currentTab+'">'+fn()+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    var on=t.getAttribute('data-tab')===currentTab;
    t.classList.toggle('on',on);
    t.setAttribute('aria-selected',on?'true':'false');
  });
  var comp=document.getElementById('composer');
  if(comp) comp.classList.toggle('on',currentTab==='chat');
  document.body.classList.toggle('chat-open',currentTab==='chat');
  document.body.classList.toggle('chat-closed',currentTab!=='chat');
  updateHeaderDate();
  if(currentTab==='chat') updateChatComposer();
  if(currentTab==='routine') tickTimer();
}

function switchTab(tab){
  if(!VIEWS[tab]) return;
  if(currentTab===tab && tab!=='home'){ window.scrollTo({top:0,behavior:'smooth'}); }
  currentTab=tab;
  closeStickerPanel();
  render();
  window.scrollTo({top:0,behavior:'auto'});
}

    '<div class="sheet-grip"></div>'+
    '<div class="sheet-head"><h2>'+esc(opt.title)+'</h2>'+(opt.desc?'<p>'+opt.desc+'</p>':'')+'</div>'+

function askText(opt){
  var field=opt.multiline
    ?'<textarea id="promptInput" rows="3" placeholder="'+esc(opt.placeholder||'')+'">'+esc(opt.value||'')+'</textarea>'
    :'<input id="promptInput" type="text" placeholder="'+esc(opt.placeholder||'')+'" value="'+esc(opt.value||'')+'">';
  showSheet({
    title:opt.title,
    desc:opt.desc||'',
    body:'<div class="field"><span>'+esc(opt.label||'내용')+'</span>'+field+(opt.hint?'<span class="hint">'+esc(opt.hint)+'</span>':'')+'</div>',
    foot:'<button class="btn btn-ghost" data-act="modal:close">취소</button><button class="btn btn-primary" data-act="prompt:ok">'+esc(opt.ok||'저장')+'</button>',
    onMount:function(){
      var el=document.getElementById('promptInput');
      if(!el) return;
      setTimeout(function(){
        el.focus();
        if(!opt.multiline && el.setSelectionRange){ var v=el.value; el.setSelectionRange(v.length,v.length); }
      },70);
    }
  });
  pendingPrompt=opt;
}
function askConfirm(opt){
  showSheet({
    title:opt.title,
    body:'<p class="sec-desc" style="font-size:12.5px;color:#7C7264">'+opt.message+'</p>',
    foot:'<button class="btn btn-ghost" data-act="modal:close">취소</button><button class="btn '+(opt.danger?'btn-pink':'btn-primary')+'" data-act="confirm:ok">'+esc(opt.ok||'확인')+'</button>'

function fmtClock(ms){
  var s=Math.max(0,Math.ceil(ms/1000));
  return pad(Math.floor(s/60))+':'+pad(s%60);

function timerRemaining(){
  var t=state.timer;
  if(t.mode==='remain'){
    if(t.running&&t.endsAt) return Math.max(0,t.endsAt-Date.now());
    return Math.max(0,Number(t.remainingMs)||0);
  }
  if(t.running&&t.startAt) return Math.max(0,(Number(t.accMs)||0)+(Date.now()-t.startAt));
  return Math.max(0,Number(t.accMs)||0);
}
function getMeal(ds){
  if(!state.meals[ds]) state.meals[ds]={breakfast:'',lunch:'',dinner:'',snack:'',note:''};
  var m=state.meals[ds];

function getHealth(ds){
  if(!state.health[ds]) state.health[ds]={morning:false,evening:false,condition:'',temp:'',memo:'',meds:{}};
  var h=state.health[ds];
  if(typeof h.morning!=='boolean') h.morning=false;
  if(typeof h.evening!=='boolean') h.evening=false;
  if(!h.meds||typeof h.meds!=='object'||Array.isArray(h.meds)) h.meds={};
  return h;
}
function medChecked(h,med){
  if(!h||!med) return false;
  var map=(h.meds&&typeof h.meds==='object')?h.meds:{};
  if(med.id&&Object.prototype.hasOwnProperty.call(map,med.id)) return !!map[med.id];
  if(med.slot==='morning') return !!h.morning;
  if(med.slot==='evening') return !!h.evening;
  return false;
}
function medSetChecked(h,med,on){
  if(!h||!med) return;
  if(!h.meds||typeof h.meds!=='object') h.meds={};
  if(med.id) h.meds[med.id]=!!on;
  if(med.slot==='morning') h.morning=!!on;
  if(med.slot==='evening') h.evening=!!on;
}
function medsDone(h){
  return (state.meds||[]).filter(function(m){return medChecked(h,m)}).length;
}

function stampCard(){
  var today=new Date();
  var ws=startOfWeek(today);
  var cells='';
  for(var i=0;i<7;i++){
    var d=addDays(ws,i);
    var ds=ymd(d);
    var on=isStamped(ds);
    var isToday=ds===ymd();

VIEWS.schedule=function(){
  var today=ymd();
  var items=(state.schedule||[]).slice().sort(function(a,b){return (a.date+''+a.time).localeCompare(b.date+''+b.time)});
  var upcoming=items.filter(function(i){return i.date>=today});
  var past=items.filter(function(i){return i.date<today}).reverse();
  function row(i,isPast){
    var dt=parseYmd(i.date);
    var diff=Math.round((parseYmd(i.date)-parseYmd(today))/86400000);
    var pill='';
    if(!isPast){
      if(diff===0) pill='<span class="pill pink">오늘</span>';
      else if(diff===1) pill='<span class="pill">내일</span>';
      else if(diff<=7) pill='<span class="pill gray">D-'+diff+'</span>';
    }
    return '<div class="sch-item'+(isPast?' past':'')+'">'+
      '<div class="sch-date"><b>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</b><span>'+WEEK[(dt.getDay()+6)%7]+'</span></div>'+
      '<div class="sch-main"><div class="sch-title">'+esc(i.title)+'</div>'+
        '<div class="sch-meta"><span>'+esc(i.time||'')+'</span><span>·</span>'+whoAvatars(i.who)+'<span>'+esc(primaryMemberName(i.who))+'</span>'+pill+'</div></div>'+
      '<button class="ibtn" data-act="sch:del" data-id="'+i.id+'" aria-label="삭제">✕</button></div>';
  }
  var empty='<div class="empty"><svg viewBox="0 0 100 100"><use href="#ch-dad"/></svg>아직 등록된 일정이 없어요<br>가족 일정을 하나 넣어 보세요</div>';
  return hero('ch-dad','가족 일정','학원·병원·약속까지 한눈에 보고 잊지 않게')+
    '<div class="card">'+
      '<div class="sec-head"><div class="sec-title">📅 다가오는 일정</div>'+
        '<div class="right"><button class="btn btn-sm btn-ghost" data-act="sch:add">+ 일정 추가</button></div></div>'+
      (upcoming.length?upcoming.map(function(i){return row(i,false)}).join(''):empty)+
    '</div>'+
    (past.length?'<div class="card tinted"><div class="sec-title">🗂️ 지난 일정</div><div style="margin-top:6px">'+past.slice(0,8).map(function(i){return row(i,true)}).join('')+'</div></div>':'');
};

  /* 키·몸무게 */
  var growth=(state.growth||[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});

var moneyFilter='all';
VIEWS.money=function(){
  var bal=balance('taekmin');
  var thisMonth=ymd().slice(0,7);
  var inSum=0,outSum=0;
  (state.ledger||[]).forEach(function(e){
    if((e.date||'').slice(0,7)!==thisMonth) return;
    if(e.type==='in') inSum+=Number(e.amount)||0; else outSum+=Number(e.amount)||0;
  });
  var list=(state.ledger||[]).slice().sort(function(a,b){return String(b.at||b.date).localeCompare(String(a.at||a.date))});
  if(moneyFilter!=='all') list=list.filter(function(e){return e.type===moneyFilter});

        '<div class="l-sub">'+dateLabel(e.date)+(e.auto?' · 공부 적립':'')+'</div></div>'+
      '<div class="l-amt '+(e.type==='in'?'in':'out')+'">'+(e.type==='in'?'+':'-')+fmtMoney(e.amount)+'</div>'+
      '<button class="l-del" data-act="money:del" data-id="'+e.id+'" aria-label="삭제">✕</button></div>';

  var filterChips=[{v:'all',t:'전체'},{v:'in',t:'적립'},{v:'out',t:'지출'}].map(function(f){return '<button class="chip'+(moneyFilter===f.v?' on':'')+'" data-act="money:filter" data-v="'+f.v+'">'+f.t+'</button>'}).join('');

    '</div>'+

      '<button class="btn btn-ghost" data-act="money:add">💰 용돈 넣기</button></div>'+

    '</div>';
};

VIEWS.chat=function(){
  var meta=state.chatMeta;
  var chips=MEMBERS.map(function(m){
    return '<button class="sender-chip'+(meta.sender===m.id?' on':'')+(meta.locked&&meta.sender!==m.id?' locked':'')+'" data-act="chat:sender" data-id="'+m.id+'" aria-pressed="'+(meta.sender===m.id)+'">'+
      avatar(m.id)+'<span>'+esc(m.name)+'</span></button>';
  }).join('');
  var lastDate='';
  var messages=(state.chat||[]).map(function(msg){
    var own=msg.from===meta.sender;
    var ds=String(msg.at||'').slice(0,10);
    var divider='';
    if(ds&&ds!==lastDate){ lastDate=ds; divider='<div class="chat-day">'+(ds===ymd()?'오늘':dateLabel(ds))+'</div>'; }
    var body=msg.type==='sticker'
      ?'<div class="bubble sticker"><svg viewBox="0 0 120 120"><use href="#'+esc(msg.sticker||'st-heart')+'"/></svg></div>'
      :'<div class="bubble">'+esc(msg.text).replace(/\n/g,'<br>')+'</div>';
    var name=MEMBER_MAP[msg.from]?MEMBER_MAP[msg.from].name:msg.from;
    return divider+'<div class="msg'+(own?' own':'')+'">'+avatar(msg.from)+'<div class="msg-col">'+
      '<div class="msg-meta">'+(own?'':'<span class="msg-name">'+esc(name)+'</span>')+'<span>'+timeLabel(msg.at)+'</span></div>'+
      body+
      '<div class="msg-reacts">'+
        '<button class="react'+(msg.heart?' on':'')+'" data-act="chat:heart" data-id="'+msg.id+'" aria-label="하트 반응"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg>'+(msg.heart?'1':'')+'</button>'+
        '<button class="react del" data-act="chat:del" data-id="'+msg.id+'" aria-label="메시지 삭제">✕</button>'+
      '</div></div></div>';
  }).join('');
  var lockNote=meta.locked
    ?'이 기기는 '+esc(MEMBER_MAP[meta.sender].name)+'로 잠겨 있어요 · 잠금을 풀면 발신자를 바꿀 수 있어요'
    :'한 번 고르면 이 기기에 기억돼요 · 다음에 또 바꿀 필요 없어요';
  return hero('ch-mom','우리 가족 채팅','택민이·엄마·아빠가 말풍선과 모몽가 스티커로 이야기해요')+
    '<div class="card sender-card">'+
      '<div class="sender-row">'+chips+'</div>'+
      '<div class="lock-row"><span class="lock-note">'+lockNote+'</span>'+
        '<button class="btn btn-sm '+(meta.locked?'btn-pink':'btn-ghost')+' lock-btn" data-act="chat:lock">'+(meta.locked?'🔓 잠금 풀기':'🔒 이 기기 잠금')+'</button></div>'+
    '</div>'+
    (messages?'<div class="chat-list">'+messages+'</div>':'<div class="chat-empty"><svg viewBox="0 0 100 100"><use href="#ch-taekmin"/></svg>첫 인사를 건네 보세요</div>');
};

function stampCalendarSheet(offset){
  stampMonthOffset=offset||0;
  var base=new Date();
  base=new Date(base.getFullYear(),base.getMonth()+stampMonthOffset,1);
  var y=base.getFullYear(), m=base.getMonth();
  var firstIdx=(new Date(y,m,1).getDay()+6)%7;
  var dim=daysInMonth(y,m);
  var cells='';
  for(var i=0;i<firstIdx;i++) cells+='<div class="cal-cell blank"></div>';
  for(var d=1;d<=dim;d++){
    var ds=y+'-'+pad(m+1)+'-'+pad(d);
    var on=isStamped(ds), isToday=ds===ymd();
    cells+='<button class="cal-cell'+(on?' on':'')+(isToday?' today':'')+'" data-act="stamp:toggle" data-date="'+ds+'" aria-label="'+ds+'">'+
      (on?'<svg viewBox="0 0 100 100"><use href="#stamp-chii"/></svg>':d)+'</button>';
  }
  var wd=WEEK.map(function(x){return '<div class="cal-wd">'+x+'</div>'}).join('');
  showSheet({
    title:y+'년 '+(m+1)+'월 도장판',
    desc:'도장을 누르면 찍히고, 다시 누르면 지워져요 · 이번 달 '+monthStampCount(stampMonthOffset)+'개',
    body:'<div class="cal-head">'+
        '<button class="btn btn-sm btn-ghost" data-act="stamp:month" data-delta="-1" aria-label="이전 달">‹</button>'+
        '<b>'+y+'.'+pad(m+1)+'</b>'+
        '<button class="btn btn-sm btn-ghost" data-act="stamp:month" data-delta="1" aria-label="다음 달">›</button></div>'+
      '<div class="cal-grid">'+wd+cells+'</div>'+
      '<div class="cal-legend"><span>🔥 '+streak()+'일 연속</span><span>·</span><span>오늘 도장 '+(isStamped(ymd())?'완료':'전')+'</span></div>',
    foot:'<button class="btn btn-ghost" data-act="modal:close">닫기</button><button class="btn btn-primary" data-act="stamp:today">오늘 도장 찍기</button>'
  });
}

/* =========================================================
   타이머 · 진행 처리
   ========================================================= */
function pauseTimer(){
  var t=state.timer;
  if(!t.running) return;
  if(t.mode==='remain'){
    t.remainingMs=Math.max(0,(Number(t.endsAt)||0)-Date.now());
    t.endsAt=null;
  } else {
    t.accMs=(Number(t.accMs)||0)+Math.max(0,Date.now()-(Number(t.startAt)||Date.now()));
    t.startAt=null;
  }
  t.running=false;
}
function startTimer(){
  var t=state.timer;
  if(t.mode==='remain'){
    if((Number(t.remainingMs)||0)<=0) t.remainingMs=(Number(t.minutes)||10)*60000;
    t.endsAt=Date.now()+t.remainingMs;
  } else {
    t.startAt=Date.now();
  }
  t.running=true; t.finished=false;
}
function resetTimer(){
  var t=state.timer;
  t.running=false; t.endsAt=null; t.startAt=null; t.accMs=0;
  t.remainingMs=(Number(t.minutes)||10)*60000; t.finished=false;
}
function finishTimer(){
  var t=state.timer;
  t.running=false; t.endsAt=null; t.remainingMs=0; t.finished=true; t.accMs=0;
  var added=stampToday(true);
  save();
  if(currentTab==='routine') render();
  toast(added?'타이머 끝! 집중해서 해냈어요 🎉 도장도 찍었어요':'타이머 끝! 오늘 공부 수 고했어요 🎉');
}
function tickTimer(){
  var t=state.timer;
  var clock=document.getElementById('timerClock');
  if(clock){
    var rem=timerRemaining();
    clock.textContent=fmtClock(rem);
    clock.classList.toggle('warn',t.mode==='remain'&&rem<=30000&&rem>0);
  }
  if(t.running && t.mode==='remain' && timerRemaining()<=0 && !t.finished){ finishTimer(); }
}

var saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){save()},350);
}

  var added=stampToday(true);

}

function toggleStudy(id){
  var it=(state.study.items||[]).filter(function(i){return i.id===id})[0];
  if(!it) return;
  it.done=!it.done;
  var ref='study:'+it.id+':'+state.day;
  if(it.done){
    if(!(state.ledger||[]).some(function(e){return e.ref===ref})){
      state.ledger.unshift({id:uid('l'),date:state.day,type:'in',amount:Number(it.money)||0,memo:it.t+' 적립',ref:ref,auto:true,at:new Date().toISOString()});
    }
    var added=stampToday(true);
    save(); render();
    toast('+'+fmtMoney(it.money)+' 적립! 잔액 '+fmtMoney(balance('taekmin'))+(added?' · 도장도 찍었어요 🎉':''));
  } else {
    state.ledger=(state.ledger||[]).filter(function(e){return e.ref!==ref});
    save(); render();
    toast(fmtMoney(it.money)+'을 다시 돌려놨어요');
  }
}

function exportData(){
  try{
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='우리-가족-기록장-백업-'+ymd()+'.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a);},1200);
    toast('백업 파일을 내려받았어요');
  }catch(e){
    toast('백업 파일을 만들지 못했어요');
  }
}

   ========================================================= */
document.addEventListener('click',function(e){
  var t=e.target;
  var overlay=t&&t.closest?t.closest('.overlay'):null;
  if(overlay&&t===overlay){ closeModal(); return; }
  var el=t&&t.closest?t.closest('[data-act]'):null;
  if(!el) return;
  var act=el.getAttribute('data-act');
  var fn=actions[act];
  if(!fn) return;
  e.preventDefault();
  try{ fn(el.dataset||{},el,e); }
  catch(err){ console.error(err); toast('앗, 처리하지 못했어요. 다시 해볼게요'); }
});

document.addEventListener('input',function(e){
  var el=e.target;
  var bind=el&&el.getAttribute?el.getAttribute('data-bind'):null;
  if(!bind) return;
  if(bind.indexOf('meal.')===0){
    var k=bind.slice(5);
    getMeal(mealDate)[k]=el.value;
    scheduleSave();
  } else if(bind.indexOf('health.')===0){
    var k2=bind.slice(7);
    getHealth(ymd())[k2]=el.value;
    scheduleSave();
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeModal(); return; }
  var tgt=e.target;
  if((e.key==='Enter'||e.key===' ')&&tgt&&tgt.dataset&&tgt.dataset.act&&tgt.tagName!=='INPUT'&&tgt.tagName!=='TEXTAREA'&&tgt.tagName!=='BUTTON'&&tgt.tagName!=='SELECT'){
    var kAct=actions[tgt.dataset.act];
    if(kAct){ e.preventDefault(); try{ kAct(tgt.dataset,tgt,e); }catch(err){ console.error(err); toast('앗, 처리하지 못했어요. 다시 해볼게요'); } return; }
  }
  if(e.key==='Enter' && e.target && e.target.id==='chatInput'){
    e.preventDefault(); sendChat(); return;
  }
  if(e.key==='Enter' && e.target && e.target.id==='promptInput'){
    e.preventDefault();
    var ok=document.querySelector('[data-act="prompt:ok"]');
    if(ok) ok.click();
  }
});

function shrinkAvatar(img,maxSide,quality){
  var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  var side=Math.min(w,h)||maxSide;
  var cv=document.createElement('canvas');
  cv.width=maxSide; cv.height=maxSide;
  var cx=cv.getContext('2d');
  cx.fillStyle='#FFFDF7'; cx.fillRect(0,0,maxSide,maxSide);
  cx.drawImage(img,(w-side)/2,(h-side)/2,side,side,0,0,maxSide,maxSide);
  return cv.toDataURL('image/jpeg',quality);
}
function applyAvatarFile(file,id){
  var mid=MEMBER_MAP[id]?id:'taekmin';
  if(!file) return;
  if(!/^image\//.test(String(file.type||''))){ toast('사진 파일을 골라 주세요'); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var tries=[[320,.9],[240,.82],[160,.75]];
      var ok=false;
      for(var i=0;i<tries.length&&!ok;i++){
        try{
          avatarPhotos[mid]=shrinkAvatar(img,tries[i][0],tries[i][1]);
          ok=saveAvatars();
        }catch(e){ ok=false; }
      }
      if(!ok){
        delete avatarPhotos[mid];
        toast('사진을 저장하지 못했어요. 다른 사진으로 해볼까요');
        return;
      }
      render();
      toast(MEMBER_MAP[mid].name+' 프로필 사진을 바꿨어요');
    };
    img.onerror=function(){ toast('사진을 읽지 못했어요'); };
    img.src=String(reader.result);
  };
  reader.onerror=function(){ toast('사진을 읽지 못했어요'); };
  reader.readAsDataURL(file);
}

var avatarEl=document.getElementById('avatarFile');
if(avatarEl){
  avatarEl.addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    var mid=e.target.getAttribute('data-mid')||'taekmin';
    e.target.value='';
    if(f) applyAvatarFile(f,mid);
  });
}

var importEl=document.getElementById('importFile');
if(importEl){
  importEl.addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    if(!f) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var parsed=JSON.parse(String(reader.result));
        if(!parsed||typeof parsed!=='object'||!parsed.members||!parsed.todos) throw new Error('형식이 달라요');
        askConfirm({title:'기록 불러오기',message:'지금 이 기기의 기록을 백업 파일 내용으로 바꿀까요? 지금 기록은 사라져요.',ok:'불러오기',onOk:function(){
          state=normalize(parsed);
          mealDate=ymd();
          rollover();
          save(); render();
          toast('백업한 기록을 불러왔어요');
        }});
      }catch(err){
        toast('이 파일은 기록장 백업 파일이 아니에요');
      }
    };
    reader.readAsText(f);
    e.target.value='';
  });
}

rollover();
render();
save();
setInterval(tickTimer,500);
window.addEventListener('focus',function(){ if(rollover()) render(); });
setTimeout(function(){
  if(!storageOK) toast('이 브라우저에서는 자동 저장이 막혀 있어요. 설정에서 백업해 두세요.');
},1500);
})();
</script>
